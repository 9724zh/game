<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>orbmrun</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #game {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      padding: 9px 12px;
      color: white;
      background: rgba(0, 0, 0, 0.55);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="hud">orbs: <span id="score">0</span>/8 · move with wasd or arrow keys</div>
  <canvas id="game"></canvas>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script>
    const canvas = document.getElementById("game");
    const engine = new BABYLON.Engine(canvas, true);

    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.55, 0.78, 0.95, 1);

    const camera = new BABYLON.ArcRotateCamera(
      "camera",
      -Math.PI / 2,
      1.05,
      15,
      new BABYLON.Vector3(0, 0, 0),
      scene
    );
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 10;
    camera.upperRadiusLimit = 22;

    const light = new BABYLON.HemisphericLight(
      "light",
      new BABYLON.Vector3(0, 1, 0),
      scene
    );
    light.intensity = 0.9;

    const ground = BABYLON.MeshBuilder.CreateGround(
      "ground",
      { width: 20, height: 20 },
      scene
    );
    const groundMaterial = new BABYLON.StandardMaterial("groundMaterial", scene);
    groundMaterial.diffuseColor = new BABYLON.Color3(0.25, 0.58, 0.32);
    ground.material = groundMaterial;

    const player = BABYLON.MeshBuilder.CreateBox(
      "player",
      { size: 1 },
      scene
    );
    player.position.y = 0.5;

    const playerMaterial = new BABYLON.StandardMaterial("playerMaterial", scene);
    playerMaterial.diffuseColor = new BABYLON.Color3(0.1, 0.35, 0.9);
    player.material = playerMaterial;

    const keys = {};
    window.addEventListener("keydown", event => keys[event.key.toLowerCase()] = true);
    window.addEventListener("keyup", event => keys[event.key.toLowerCase()] = false);

    const orbs = [];
    const orbMaterial = new BABYLON.StandardMaterial("orbMaterial", scene);
    orbMaterial.diffuseColor = new BABYLON.Color3(1, 0.75, 0.1);
    orbMaterial.emissiveColor = new BABYLON.Color3(0.35, 0.2, 0);

    for (let i = 0; i < 8; i++) {
      const orb = BABYLON.MeshBuilder.CreateSphere(
        "orb" + i,
        { diameter: 0.65 },
        scene
      );

      orb.position.set(
        Math.random() * 16 - 8,
        0.45,
        Math.random() * 16 - 8
      );
      orb.material = orbMaterial;
      orbs.push(orb);
    }

    let score = 0;
    const scoreElement = document.getElementById("score");

    engine.runRenderLoop(() => {
      const speed = 0.12;

      if (keys["w"] || keys["arrowup"]) player.position.z -= speed;
      if (keys["s"] || keys["arrowdown"]) player.position.z += speed;
      if (keys["a"] || keys["arrowleft"]) player.position.x -= speed;
      if (keys["d"] || keys["arrowright"]) player.position.x += speed;

      player.position.x = BABYLON.Scalar.Clamp(player.position.x, -9, 9);
      player.position.z = BABYLON.Scalar.Clamp(player.position.z, -9, 9);

      camera.target.x = player.position.x;
      camera.target.z = player.position.z;

      for (const orb of orbs) {
        if (orb.isEnabled() &&
            BABYLON.Vector3.Distance(player.position, orb.position) < 0.85) {
          orb.setEnabled(false);
          score++;
          scoreElement.textContent = score;
        }
      }

      if (score === 8) {
        document.getElementById("hud").textContent = "All orbs collected.";
      }

      scene.render();
    });

    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
